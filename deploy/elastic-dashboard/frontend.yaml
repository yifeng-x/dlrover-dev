apiVersion: apps/v1
kind: Deployment
metadata:
  name: elastic-dashboard-web-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: elastic-dashboard-web-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elastic-dashboard-web-dev
    spec:
      containers:
        - name: web
          image: node:22-alpine
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          workingDir: /workspace
          command: ["/bin/sh", "-ec"]
          args:
            - |
              npm ci
              exec npm run dev -- --host 0.0.0.0 --port 8080 --strictPort
          env:
            - name: DLROVER_ELASTIC_API_URL
              value: http://elastic-dashboard:8080
            - name: CHOKIDAR_USEPOLLING
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
          volumeMounts:
            - name: source
              mountPath: /workspace
              # Path in the existing PVC containing the frontend package.json.
              subPath: web/elastic-dashboard
            - name: dependencies
              mountPath: /workspace/node_modules
      volumes:
        - name: source
          persistentVolumeClaim:
            # Set to the existing source PVC in the deployment namespace.
            claimName: elastic-dashboard-web-source
        - name: dependencies
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: elastic-dashboard-web-dev
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: elastic-dashboard-web-dev
  ports:
    - name: http
      port: 80
      targetPort: http
