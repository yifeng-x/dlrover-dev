---
apiVersion: v1
kind: Service
metadata:
  name: elastic-dashboard-web
spec:
  selector:
    app.kubernetes.io/name: elastic-dashboard-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elastic-dashboard-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elastic-dashboard-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elastic-dashboard-web
    spec:
      containers:
        - name: web
          image: "YOUR_REGISTRY/dlrover/elastic-dashboard-web:0.1.0"
          env:
            - name: DASHBOARD_BACKEND
              value: "elastic-dashboard:8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
