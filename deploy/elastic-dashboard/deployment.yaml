apiVersion: apps/v1
kind: Deployment
metadata:
  name: elastic-dashboard
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elastic-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elastic-dashboard
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: api
          image: YOUR_REGISTRY/dlrover/elastic-dashboard:0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              exec python -m dlrover.dashboard.elastic \
                --host 0.0.0.0 --port 8080 \
                > >(tee /data/logs/elastic-dashboard/elastic-dashboard.log) 2>&1
          envFrom:
            - configMapRef:
                name: elastic-dashboard-config
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 8
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
