---
{{- if .Values.controller.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dlrover-controller-manager-metrics-monitor
  namespace: {{ .Release.Namespace }}
  labels:
    control-plane: controller-manager
    {{- with .Values.controller.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  endpoints:
    - path: /metrics
      port: https
      scheme: https
      interval: {{ .Values.controller.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.controller.metrics.serviceMonitor.scrapeTimeout }}
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        insecureSkipVerify: {{ .Values.controller.metrics.serviceMonitor.tlsConfig.insecureSkipVerify }}
{{- end }}