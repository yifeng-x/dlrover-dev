{{- if .Values.dashboardWeb.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elastic-dashboard-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elastic-dashboard-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elastic-dashboard-web
    spec:
      containers:
        - name: web
          image: {{ required "Set dashboardWeb.image to the frontend image reference" .Values.dashboardWeb.image | quote }}
          env:
            - name: DASHBOARD_BACKEND
              value: {{ .Values.dashboardWeb.backend | quote }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: elastic-dashboard-web
spec:
  selector:
    app.kubernetes.io/name: elastic-dashboard-web
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
