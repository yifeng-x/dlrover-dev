---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dlrover-brain
  namespace: dlrover
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: dlrover-brain
  endpoints:
    - port: metrics  # <--- 匹配 containerPort 的 name
      path: /metrics
      interval: 15s
      scrapeTimeout: 5s
