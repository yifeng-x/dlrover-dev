# Replace service URLs before use. Loaded at Master startup.
# Set metadata.labels.low_code_platform_task_id on the ElasticJob.
# The task label is the only task ID source; no environment fallback.
apiVersion: v1
kind: ConfigMap
metadata:
  name: benefit-validation-env
  namespace: dlrover-benefit-test
data:
  DLROVER_BENEFIT_MODE: "shadow"
  DLROVER_BENEFIT_OBJECTIVE: "time"
  DLROVER_BENEFIT_HTTP_URL: "http://REPLACE-BENEFIT-SERVICE/benefit/snapshot"
  DLROVER_BENEFIT_TIMEOUT_SECONDS: "3"
  DLROVER_BENEFIT_MAX_AGE_SECONDS: "60"
  DLROVER_BENEFIT_MIN_WINDOW_SECONDS: "30"
  DLROVER_BENEFIT_MIN_GAIN_RATIO: "0.05"
  DLROVER_BENEFIT_EXPLORE: "false"
  DLROVER_SWANLAB_HTTP_URL: "http://REPLACE-METRICS-SERVICE/metrics/scalar/by-task-name"
  # Testing only: true reads a raw scalar JSON file instead of calling SwanLab.
  DLROVER_SWANLAB_MOCK: "false"
  DLROVER_SWANLAB_MOCK_FILE: "/tmp/dlrover-benefit-validation/swanlab-mock.json"
  # SwanLab createTime is confirmed to be training sampling time.
  DLROVER_SWANLAB_TIME_SOURCE: "sample"
  DLROVER_SWANLAB_WARMUP_SECONDS: "60"
  DLROVER_SWANLAB_STEADY_WINDOWS: "2"
  DLROVER_SWANLAB_MAX_THROUGHPUT_VARIATION: "0.1"
  DLROVER_SWANLAB_UTC_OFFSET: "+08:00"
  # Assumption: optimizer-step work is fixed across all resource tiers.
  DLROVER_SWANLAB_ASSUME_FIXED_BATCH: "true"
  DLROVER_SWANLAB_KEYS: '{"work":"global_step","target_work":"max_steps","train_speed":"train_speed"}'
