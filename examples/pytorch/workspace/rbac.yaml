---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dlrover-workspace
  namespace: dlrover
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dlrover-workspace
  namespace: dlrover
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dlrover-workspace
  namespace: dlrover
subjects:
  - kind: ServiceAccount
    name: dlrover-workspace
    namespace: dlrover
roleRef:
  kind: Role
  name: dlrover-workspace
  apiGroup: rbac.authorization.k8s.io
