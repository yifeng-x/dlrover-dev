---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: elastic-train-pv-dlrover
  namespace: dlrover
  labels:
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/home/xzx/workerspace"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elastic-train-pvc-dlrover
  namespace: dlrover
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi